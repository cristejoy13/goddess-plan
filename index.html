<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Goddess Plan</title>

    <!-- PWA / installability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Goddess Plan" />
    <meta name="theme-color" content="#1a0c12" />

    <!-- Icons -->
    <!-- Her logo, copied exactly as she made it (1254 × 1254). The browser
         tab shows the see-through lotus; the home-screen app keeps the one
         with its starry background. -->
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <!-- Browser tab: the see-through lotus, in small sizes every browser takes
         (phones, iPads, laptops, desktops). The installed app keeps the
         starry icon above and in the manifest. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
