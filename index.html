<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iPhone/iPad zooming in every time she taps a
         text box (diary, meals) and leaving the page zoomed (2026-10-09).
         iOS still lets her pinch-zoom by hand; it ignores this for that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Goddessed</title>

    <!-- PWA / installability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Goddessed" />
    <meta name="theme-color" content="#1a0c12" />

    <!-- Icons -->
    <!-- Her logo, copied exactly as she made it (1254 × 1254). The browser
         tab shows the see-through lotus; the home-screen app keeps the one
         with its starry background. -->
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <!-- Browser tab: the see-through lotus, in small sizes every browser takes
         (phones, iPads, laptops, desktops). The installed app keeps the
         starry icon above and in the manifest. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  </head>
  <body>
    <!-- Her logo from the first moment (2026-10-10): before the app's code has
         loaded, the page shows the lotus on her background instead of a blank
         screen. React replaces it the moment the app draws. The background
         follows her light/dark choice. -->
    <script>
      try { if (localStorage.getItem('gp_color_mode') === 'light') document.documentElement.setAttribute('data-boot', 'light'); } catch (e) {}
      // The logo's height on the screen is fixed once, here (2026-10-22). On
      // an installed iPhone app the page grows by the notch gap a moment
      // after launch, so a logo centred in the page slid down mid-load. The
      // home-screen app fills the whole screen, so its middle is the screen's
      // middle; in a browser it is the window's middle at the first moment.
      try {
        var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
        var land = window.matchMedia && matchMedia('(orientation: landscape)').matches;
        var sh = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        var mid = Math.round((standalone && sh ? sh : window.innerHeight) / 2);
        if (mid > 0) document.documentElement.style.setProperty('--boot-y', mid + 'px');
      } catch (e) {}
    </script>
    <style>
      html, body { background: #07040f; margin: 0; }
      html[data-boot="light"], html[data-boot="light"] body { background: #fff5fb; }
      #boot-splash, #boot-cover { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot-cover { z-index: 2147483647; background: #07040f; }
      html[data-boot="light"] #boot-cover { background: #fff5fb; }
      #boot-splash img, #boot-cover img, #boot-splash::after, #boot-cover::after {
        position: absolute; left: 50%; top: var(--boot-y, 50%); transform: translate(-50%, -50%);
      }
      /* Her see-through lotus (2026-10-26), not the square icon: no box, no shadow. */
      #boot-splash img, #boot-cover img { width: 112px; height: 112px; object-fit: contain; }
      /* A ring turning around the logo while the app loads (2026-10-22). */
      #boot-splash::after, #boot-cover::after {
        content: ''; width: 144px; height: 144px; box-sizing: border-box; border-radius: 50%;
        border: 3px solid rgba(255,92,157,0.18); border-top-color: #ff5c9d;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash::after, #boot-cover::after { animation-duration: 2.4s; } }
    </style>
    <div id="root"><div id="boot-splash"><img src="/logo-splash.png" alt="" width="112" height="112" /></div></div>
    <!-- One load only (2026-10-10). The logo stays over the app for a moment
         while the app checks for a newer version, so a new version swaps in
         behind the logo instead of the app showing and then reloading.
         src/utils/swUpdate.js lifts it; this lifts it anyway after 8 s. -->
    <div id="boot-cover"><img src="/logo-splash.png" alt="" width="112" height="112" /></div>
    <script>
      setTimeout(function () { var c = document.getElementById('boot-cover'); if (c && !window.__gpReloading) c.remove(); }, 8000);
    </script>
    <!-- Safety net (2026-10-08, after her iPad sat on a blank loading screen):
         if the app has not drawn anything 12 seconds after opening, and the
         device is online, the saved copy of the app's FILES is cleared once
         and the page reloads, fetching the current version. Her data lives in
         localStorage and the sync database, which this never touches. Runs at
         most once per session, and never offline, where the saved copy is
         the only way the app can open. -->
    <script>
      (function () {
        try {
          setTimeout(function () {
            // The logo is still there only if the app never drew.
            if (!document.getElementById('boot-splash') || navigator.onLine === false) return;
            if (sessionStorage.getItem('gp_boot_retry')) return;
            sessionStorage.setItem('gp_boot_retry', '1');
            var go = function () { location.reload(); };
            var jobs = [];
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(go, go);
          }, 12000);
        } catch (e) { /* the app still loads normally */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
